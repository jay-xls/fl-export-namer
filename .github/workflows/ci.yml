# Runs on every pull request and every push to main: lint, tests, and the app's
# own selftest on a real Windows machine. A red X here = don't merge.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes src tests
      - name: Tests
        run: python -m pytest -q tests
      - name: Selftest from source
        shell: pwsh
        run: |
          python src/launcher.py --selftest
          $code = $LASTEXITCODE
          Get-Content "$env:APPDATA\DAW Export Fixer\selftest.txt"
          exit $code
