# Builds the Windows app and publishes a GitHub Release.
#
# Two ways to start it:
#   - Actions tab -> "release" -> Run workflow   (uses the version in namer_core.py)
#   - push a tag like v1.3.0                      (must match the version in namer_core.py)
# Output on the release page: Setup.exe, a zip, SHA256 checksums, notes from CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Work out version
        shell: pwsh
        run: |
          $m = Select-String -Path namer_core.py -Pattern '^__version__ = "(.+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} doesn't match __version__ $v in namer_core.py"
          }
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v$v already exists - bump __version__ in namer_core.py first." }
          $global:LASTEXITCODE = 0
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py ${{ env.VERSION }} > notes.md

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean --workpath build/pyi --distpath dist build_kit/FLExportNamer.spec

      - name: Selftest the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FL Export Namer\FL Export Namer.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\FL Export Namer\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Zip
        run: python -m zipfile -c "dist/FL Export Namer ${{ env.VERSION }}.zip" "dist/FL Export Namer"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=${{ env.VERSION }}" build_kit\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip", ".txt" } | ForEach-Object { $_.FullName }
          gh release create "v${{ env.VERSION }}" @files --title "FL Export Namer ${{ env.VERSION }}" --notes-file notes.md --target "${{ github.sha }}"
